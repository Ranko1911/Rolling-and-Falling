<!doctype html>
<html lang="en" translate="no" data-bs-theme="dark">

<head>
    <title>Next Session Countdown</title>
    <meta name="author" content="Ranko" />
    <meta name="description" content="Countdown to the next Rolling and Falling session." />
    <meta name="keywords" content="DnD5e, Homebrew, Countdown" />
    <link href="./images/icons/dado_blanco_fondo_negro.webp" rel="icon" type="image/x-icon" />

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="./scripts/loadComponents.js"></script>

    <link rel="stylesheet" href="./css/index.css" />
    <link rel="stylesheet" href="./css/wiki.css" />
    <style>
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .countdown-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 10px;
            min-width: 120px;
        }

        .countdown-number {
            font-size: 3rem;
            font-weight: bold;
            display: block;
        }

        .countdown-label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #next-session-date {
            font-style: italic;
            color: #ffc107;
        }
    </style>
</head>

<body data-root="./">
    <div id="header1"></div>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Sidebar Column -->
            <div class="col-md-3 mb-4">
                <div id="sidebar-container"></div>
            </div>

            <!-- Main Content Column -->
            <div class="col-md-9">
                <!-- Breadcrumbs -->
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="./index.html">Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Next Session</li>
                    </ol>
                </nav>

                <div class="wiki-content text-center">
                    <h1 class="mb-4">Next Session</h1>
                    <p class="lead">The next adventure begins in:</p>

                    <div id="countdown" class="countdown-container">
                        <div class="countdown-item">
                            <span class="countdown-number" id="days">00</span>
                            <span class="countdown-label">Days</span>
                        </div>
                        <div class="countdown-item">
                            <span class="countdown-number" id="hours">00</span>
                            <span class="countdown-label">Hours</span>
                        </div>
                        <div class="countdown-item">
                            <span class="countdown-number" id="minutes">00</span>
                            <span class="countdown-label">Minutes</span>
                        </div>
                        <div class="countdown-item">
                            <span class="countdown-number" id="seconds">00</span>
                            <span class="countdown-label">Seconds</span>
                        </div>
                    </div>

                    <div class="mt-5">
                        <p>Scheduled for: <span id="next-session-date">Loading...</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer1"></div>

    <script>
        // CONFIGURATION: Set the date and time of the next session here
        // Format: "Month Day, Year Hour:Minute:Second"
        const nextSessionDate = "September 26, 2026 16:00:00";

        document.getElementById('next-session-date').textContent = nextSessionDate;

        function updateCountdown() {
            const now = new Date().getTime();
            const targetDate = new Date(nextSessionDate).getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById("countdown").innerHTML = "<h2>The session has started!</h2>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown(); // Initial call
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>

</html>
