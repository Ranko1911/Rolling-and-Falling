<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <title>Lugares de Terranova — Rolling and Falling</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="Ranko" />
  <meta name="description" content="Catalog of places, regions, cities, and wilderness in Terranova." />
  <link rel="icon" href="../../images/icons/dado_blanco_fondo_negro.webp" type="image/x-icon" />

  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <!-- Styles -->
  <link rel="stylesheet" href="../../css/wiki.css" />
  <link rel="stylesheet" href="../../css/display.css" />

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../scripts/loadComponents.js"></script>
</head>

<body data-root="../../">
  <div id="header1"></div>

  <main class="container-fluid mt-4">
    <div class="row g-4">
      <aside class="col-lg-3 col-md-4">
        <div id="sidebar-container"></div>
      </aside>

      <section class="col-lg-9 col-md-8">
        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="../../index.html">Inicio</a></li>
            <li class="breadcrumb-item">Lugares</li>
            <li class="breadcrumb-item active" aria-current="page">Catálogo de Regiones</li>
          </ol>
        </nav>

        <div class="wiki-content p-4 p-lg-5">
          <div class="d-flex align-items-center justify-content-between border-bottom border-secondary pb-3 mb-4">
            <div>
              <h1 class="display-5 text-warning fw-bold mb-1">🗺️ Lugares & Regiones</h1>
              <p class="text-secondary mb-0">Ciudades, fortalezas, abismos y zonas salvajes en Terranova.</p>
            </div>
            <a href="../lore/terranova.html" class="btn btn-outline-gold btn-sm">
              🌍 Ver Lore de Terranova
            </a>
          </div>

          <!-- Places Grid -->
          <div class="row g-4" id="placesGrid">
            <!-- Rendered dynamically from manifest -->
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="footer1"></div>

  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      const grid = document.getElementById("placesGrid");
      try {
        const res = await fetch("../../data/content-manifest.json");
        if (res.ok) {
          const data = await res.json();
          const items = data.entries.filter(e => e.category === "places");
          
          grid.innerHTML = items.map(item => {
            const linkUrl = `../view.html?id=${item.id}`;
            const isDanger = item.status && item.status.toLowerCase().includes("peligro");
            const badgeClass = isDanger ? "rpg-badge-crimson" : "rpg-badge-gold";

            return `
              <div class="col-md-6 col-xl-4">
                <div class="card display-card h-100">
                  <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                      <span class="rpg-badge ${badgeClass}">${item.type || 'Lugar'}</span>
                      <span class="badge bg-secondary">${item.region || 'Terranova'}</span>
                    </div>
                    <h4 class="card-title text-warning mb-2">
                      <a href="${linkUrl}">${item.title}</a>
                    </h4>
                    <p class="card-text text-secondary small">
                      ${item.description || item.subtitle || ''}
                    </p>
                  </div>
                  <div class="card-footer bg-transparent border-top-0 pt-0">
                    <a href="${linkUrl}" class="btn btn-outline-gold btn-sm w-100">Ver Ficha</a>
                  </div>
                </div>
              </div>
            `;
          }).join("");
        }
      } catch (e) {
        console.warn("Could not load dynamic manifest:", e);
      }
    });
  </script>
</body>

</html>
