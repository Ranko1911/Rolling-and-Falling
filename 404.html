<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <title>Error 404 — Rolling and Falling</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.5" />
  <link rel="icon" href="./images/icons/dado_blanco_fondo_negro.webp" type="image/x-icon" />

  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link rel="stylesheet" href="./css/wiki.css" />

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./scripts/loadComponents.js"></script>
</head>

<body data-root="./">
  <div id="header1"></div>

  <main class="container mt-5 py-4">
    <div class="wiki-content p-5 text-center shadow-lg position-relative overflow-hidden">
      <span class="rpg-badge rpg-badge-crimson mb-3 fs-6">ERROR 404 — PERDIDO EN EL SHADOWFELL</span>
      <h1 class="display-3 text-warning fw-bold mb-3">🎲 Nat 1 en Navegación</h1>
      <p class="lead text-light mb-4">Lo sentimos, la página o el camino que intentas seguir no existe en este plano de existencia.</p>

      <!-- Random D&D Message Card -->
      <div class="card bg-dark border-secondary p-3 mb-4 mx-auto max-w-600">
        <p class="mb-0 text-warning fst-italic fs-5" id="randomMessage">Cargando evento aleatorio...</p>
      </div>

      <!-- Quick Action Buttons -->
      <div class="d-flex flex-wrap justify-content-center gap-3 mt-4">
        <a href="./index.html" class="btn btn-custom btn-lg px-4 d-inline-flex align-items-center gap-2">
          <span>🏠</span> Volver al Inicio
        </a>
        <a href="./pages/lore/terranova.html" class="btn btn-outline-gold btn-lg px-4 d-inline-flex align-items-center gap-2">
          <span>🌍</span> Explorar Lore
        </a>
        <button class="btn btn-outline-light btn-lg px-4 d-inline-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#searchModal">
          <span>🔍</span> Buscar en la Wiki
        </button>
      </div>
    </div>
  </main>

  <div id="footer1"></div>

  <script>
    const messages = [
      '¡Oops! Parece que el dado natural 1 ha intervenido en tu tirada.',
      'Los planes de tu personaje se han visto afectados por un fallo en la trama mágica.',
      'El hechizo de teletransporte se ha descontrolado, ¡necesitas una tirada de salvación!',
      'Los engranajes del Dungeon Master han encontrado un obstáculo inesperado.',
      'El laberinto ha cambiado sin previo aviso. ¡Recompongan sus mapas!',
      'El cofre del tesoro estaba atrapado. Intenten una nueva combinación.',
      'Los dados han caído de la mesa y se han mezclado con las miniaturas.',
      'El encuentro aleatorio resultó ser más desafiante de lo esperado.',
      'La maldición del nat 20 se ha invertido. ¡Es hora de tirar de nuevo!',
      'El PNJ crucial para la misión ha desaparecido inexplicablemente.',
      'El pergamino de hechizos se ha mezclado con un libro de recetas orcas.',
      'La trampa fue desactivada, pero ahora no se puede encontrar la salida.',
      'El artefacto mágico ha mostrado una inscripción en un idioma desconocido.',
      'El misterioso acertijo no tiene solución lógica. ¡Necesitamos ayuda!',
      'El contrato con el demonio se ha roto inesperadamente.'
    ];

    function showRandomMessage() {
      var randomIndex = Math.floor(Math.random() * messages.length);
      document.getElementById('randomMessage').textContent = `"${messages[randomIndex]}"`;
    }

    showRandomMessage();
  </script>
</body>

</html>
